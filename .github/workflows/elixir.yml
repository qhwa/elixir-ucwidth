---
name: build

env:
  MIX_ENV: test
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        otp: ['26', '27', '28', '29']
        elixir: ['1.17.3', '1.18.4', '1.19.5', '1.20.2']
        exclude:
          - elixir: 1.20.2
            otp: 26
          - elixir: 1.19.5
            otp: 26
          - elixir: 1.17.3
            otp: 28
          - elixir: 1.17.3
            otp: 29
          - elixir: 1.18.4
            otp: 28
          - elixir: 1.18.4
            otp: 29
    steps:
      - name: Setup elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Checkout repository
        uses: actions/checkout@v1

      - name: Get deps cache
        uses: actions/cache@v4
        with:
         path: deps/
         key: ${{ runner.os }}-deps-${{ hashFiles('**/mix.lock') }}
         restore-keys: ${{ runner.os }}-deps-

      - name: Get build cache
        uses: actions/cache@v4 
        with:
          path: _build
          key: ${{ runner.os }}-build-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-build-

      - name: Install Dependencies
        run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get
          mix compile

      - name: Run Lintings
        run: |
          MIX_ENV=dev mix dialyzer && MIX_ENV=dev mix credo

      - name: Run Tests
        run: |
          mix coveralls.github
